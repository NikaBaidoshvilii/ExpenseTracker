<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
</head>
<body>
    <h1>Expense Tracker</h1>

    <form id="expense-form">
    <input id="title" type="text" placeholder="Title" required>
    <input id="amount" type="number" step="0.01" placeholder="Amount" required>
    <input id="category" type="text" placeholder="Category" required>
    <input id="date" type="date" required>
    <button id="submit-button" type="submit">Add</button>
    <button id="cancel-button" type="button" hidden>Cancel</button>
    </form>

    <ul id="errors"></ul>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="expenses-body"></tbody>
    </table>





    <script src="app.js"></script>
</body>
</html>
