<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>

<body>
    <h1>Expense Tracker</h1>

    <form id="expense-form">
        <input id="title" type="text" placeholder="Title" required>
        <input id="amount" type="number" step="0.01" placeholder="Amount" required>
        <input id="category" type="text" placeholder="Category" required>
        <input id="date" type="date" required>
        <button id="submit-button" type="submit">Add</button>
        <button id="cancel-button" type="button" hidden>Cancel</button>
    </form>

    <ul id="errors"></ul>

    <div id="filters">
        <select id="filter-month">
            <option value="">All Months</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
        <input id="filter-year" type="number" placeholder="Year">
        <input id="filter-category" type="text" placeholder="Category">
        <button id="apply-filters" type="button">Filter</button>
        <button id="clear-filters" type="button">Clear</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="expenses-body"></tbody>
        </table>
    </div>

    <h2>Summary</h2>
    <div id="summary"></div>





    <script src="app.js"></script>
</body>

</html>
